# ~/.tmux.conf — native Windows (MSYS2) tmux, driven by win-pty
# ---------------------------------------------------------------------------
# Default pane shell is PowerShell 7 (pwsh). MSYS2 bash is always one key away.
# A pane with no explicit command (e.g. `pty_spawn` with cmd=None, or a plain
# prefix-c new window) runs pwsh. Pass an explicit command to get bash instead.
#
# Each pwsh pane first runs pane-init.ps1, which repairs the environment the
# cygwin/tmux round-trip breaks (PATHEXT, USERNAME, dropped PATH entries) so an
# agent in a pane can run `win-pty ...` / `wmux ...` with no setup.
#
# install.ps1 rewrites the placeholder below to this winmux folder's absolute
# path. Installing by hand? Replace it with your winmux path, forward slashes,
# e.g. C:/Claude/winmux/pane-init.ps1

set -g default-command "pwsh -NoLogo -NoExit -File @@WINMUX@@/pane-init.ps1"

# Quality-of-life
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi

# --- truecolor + smooth TUI rendering (Claude Code and other TUIs) ----------
# Inside tmux, TUIs otherwise drop to a degraded mode (downsampled colour,
# choppy animation). Advertise RGB/truecolor, allow passthrough, and export the
# vars that make Claude Code use truecolor + synchronized (flicker-free) frames.
set  -as terminal-features ",*:RGB"
set  -g  allow-passthrough on
set-environment -g COLORTERM truecolor
set-environment -g CLAUDE_FORCE_SYNCHRONIZED_OUTPUT 1

# --- bash / pwsh on demand --------------------------------------------------
# prefix + P : new window running PowerShell 7
bind P new-window -n pwsh "pwsh -NoLogo"
# prefix + B : new window running an MSYS2 bash login shell
bind B new-window -n bash "bash -l"
# prefix + b : drop the CURRENT pane into bash (splits below)
bind b split-window -v "bash -l"
# prefix + | and prefix + - : split into bash (vertical / horizontal)
bind | split-window -h "bash -l"
bind - split-window -v "bash -l"

# Reload this config with prefix + R
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
